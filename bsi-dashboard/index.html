<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Bitiruvchilar bandligi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0f1c; --side:#0b1221; --card:#111827; --card-2:#0d1424; --text:#e5e7eb; --muted:#8b98ad; --line:rgba(148,163,184,.14);
  --primary:#3b82f6; --primary-2:#60a5fa; --primary-soft:rgba(59,130,246,.16);
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --violet:#a78bfa; --cyan:#22d3ee;
  --radius:14px; --shadow:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column}
.sbrand{display:flex;gap:12px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(37,99,235,.35)}
.logo svg{width:22px;height:22px}
.sbrand b{display:block;color:#fff;font-size:14px;line-height:1.25}
.sbrand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:12px 10px 6px;font-weight:600}
.nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-size:13.5px;font-weight:500;line-height:1.3}
.nav a:hover{background:rgba(148,163,184,.08)}
.nav a.on{background:var(--primary-soft);color:#fff;box-shadow:inset 3px 0 0 var(--primary)}
.nav a svg{width:18px;height:18px;flex:none;color:var(--muted)}
.nav a.on svg{color:var(--primary-2)}
.nav a small{margin-left:auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.sfoot{padding:14px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:10px}
.sfoot b{color:var(--text)}
.main{min-width:0;background-image:radial-gradient(1000px 420px at 20% -10%,rgba(59,130,246,.14),transparent 60%),radial-gradient(800px 380px at 100% 0,rgba(124,58,237,.10),transparent 60%);background-repeat:no-repeat}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(10,15,28,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .tt{font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.topbar .dt{font-size:12px;color:var(--muted);white-space:nowrap}
.topbar .dt b{color:var(--text)}
.page{padding:22px 24px 40px;max-width:1440px}
.menu-btn{display:none}
.scrim{display:none}

.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.pri:hover{background:#2563eb}
.btn.icon{padding:8px}

/* ---------- Page header ---------- */
.ph{margin-bottom:18px}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--primary-2);background:var(--primary-soft);border-radius:99px;padding:3px 10px;text-transform:uppercase;letter-spacing:.05em}
.ph h1{font-size:22px;line-height:1.3;margin:10px 0 4px;color:#fff;letter-spacing:-.01em;font-weight:700}
.ph p{margin:0;color:var(--muted);font-size:13px}

/* ---------- Common ---------- */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:13px;padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--primary);color:#fff}
.seg button:not(.on):hover{color:var(--text)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc,var(--primary))}
.kpi .lbl{color:var(--muted);font-size:12px;font-weight:500;min-height:32px}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff;margin-top:4px}
.kpi .sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .sub b{color:var(--acc,var(--primary))}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px;font-weight:700;color:#fff}
.card .hint{margin:0 0 12px;color:var(--muted);font-size:12px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chead .hint{margin:0}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.chart{position:relative;height:300px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inp,.sel{padding:8px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:13px;background:var(--card-2);color:var(--text);max-width:100%}
.inp::placeholder{color:#64748b}
.sel option{background:#111827}
.inp{min-width:240px}
.track{height:9px;background:rgba(148,163,184,.14);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;transition:width .6s ease}

/* Index hero */
.hero{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:center}
.ring{position:relative;width:210px;height:210px;margin:0 auto}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.ring .num b{font-size:44px;font-weight:800;letter-spacing:-.03em;color:#fff;display:block;line-height:1}
.ring .num span{font-size:12px;color:var(--muted)}
.ring .num em{font-style:normal;font-size:13px;font-weight:700;color:var(--primary-2);display:block;margin-top:6px}
.comp{display:grid;gap:14px}
.comp .h{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:8px}
.comp .h span{color:var(--muted)}
.comp .h b{color:#fff;font-variant-numeric:tabular-nums;white-space:nowrap}
.coefs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
.coef{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.coef .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.coef .v{font-size:18px;font-weight:800;color:#fff;margin-top:2px;font-variant-numeric:tabular-nums}
.coef .v small{font-size:12px;color:var(--muted);font-weight:500}
.chg{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px}
.chg.down{background:rgba(34,197,94,.15);color:var(--green)}
.chg.up{background:rgba(239,68,68,.15);color:var(--red)}
.chg.eq{background:rgba(148,163,184,.12);color:var(--muted)}

/* ---------- Excel-uslubidagi jadval ---------- */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px}
.xl table{width:100%;border-collapse:collapse;font-size:12.5px}
.xl td{border:1px solid rgba(148,163,184,.10);padding:7px 9px;vertical-align:middle}
.xl td.t{max-width:380px;min-width:96px}
.xl td.t.w{min-width:200px}
.tw.tall{max-height:78vh}
.xl tr.stk td{position:sticky;top:0;z-index:2}
.xl td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.xl tr.head td{background:#13203a;color:#dbe7ff;font-weight:600;font-size:12px;text-align:center;min-width:64px;line-height:1.3}
.xl tr.tot td{background:rgba(59,130,246,.14);font-weight:700;color:#fff}
.xl tr.data:hover td{background-color:rgba(59,130,246,.07)}
.xl tr.sec td{font-weight:700;color:#fff;padding:14px 10px 8px;border-left:0;border-right:0;background:var(--card)}
.xl tr.note td{color:var(--muted);font-size:12px;border:0;padding:6px 10px;background:var(--card)}
.xl tr.sp td{border:0;height:10px;padding:0;background:var(--card)}
.xl tr.data td.nz{color:#fff}
.cnt{font-size:12px;color:var(--muted)}

/* Excel ranglari bilan jadval */
.tw.xs{background:#fff;border-color:rgba(255,255,255,.25)}
.xs table{width:auto;min-width:100%;border-collapse:collapse;font-size:12.5px;color:#111;font-family:Calibri,Inter,"Segoe UI",Arial,sans-serif}
.xs td{border:1px solid #d0d7e2;padding:5px 8px;vertical-align:middle;background:#fff;color:#111}
.xs td.t{max-width:420px;min-width:0}
.xs td.t.w{min-width:0}
.xs tr.sp td{height:10px;padding:0;background:#fff;border-left:0;border-right:0}
.xs tr.data:hover td{filter:brightness(.94)}
.xs tr.sec td,.xs tr.note td{padding:6px 8px}
.xs .empty{color:#555;background:#fff}

/* Misc */
.overlay{position:fixed;inset:0;background:rgba(10,15,28,.94);display:grid;place-items:center;z-index:80}
.overlay .box{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;max-width:460px;text-align:center;margin:16px}
.overlay h2{margin:0 0 6px;font-size:18px;color:#fff}
.overlay p{color:var(--muted);margin:0 0 16px}
.spin{width:34px;height:34px;border:3px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.hidden{display:none!important}
.empty{color:var(--muted);text-align:center;padding:24px}

@media (max-width:1200px){.s4,.s5,.s7,.s8{grid-column:span 6}.coefs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:286px;max-width:86vw;z-index:60;transform:translateX(-100%);transition:transform .22s ease}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}
  .menu-btn{display:inline-flex}
  .hero{grid-template-columns:1fr}
  .s4,.s5,.s6,.s7,.s8{grid-column:span 12}
  .topbar{padding:10px 16px}.page{padding:18px 16px 36px}
}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:21px}.inp{min-width:0;width:100%}.tools{width:100%}.topbar .dt{display:none}.ph h1{font-size:18px}}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side">
    <div class="sbrand">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg></div>
      <div><b>Bitiruvchilar bandligi</b><span id="otm">Oliy ta'lim muassasasi</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">
      <div>Ma'lumot sanasi: <b id="date">—</b><br>Manba: <span id="fileName">data.xlsx</span></div>
      <label class="btn pri" title="Kompyuterdan Excel faylni tanlab ko'rish">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
        Excel yuklash
        <input type="file" id="fileInp" accept=".xlsx,.xls" hidden>
      </label>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar">
      <button class="btn icon menu-btn" id="menuBtn" aria-label="Menyu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="tt" id="topTitle">Yuklanmoqda…</div>
      <div class="sp"></div>
      <div class="dt">career.edu.uz ma'lumotlari · <b id="date2">—</b></div>
    </div>
    <main class="page" id="page"></main>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="box" id="ovBox">
    <div class="spin"></div>
    <h2>Ma'lumotlar yuklanmoqda…</h2>
    <p>Excel fayl o'qilmoqda</p>
  </div>
</div>

<script>
/* ============================ SOZLAMALAR ============================ */
const DATA_URL = 'data.xlsx';            // sahifa bilan bitta papkadagi Excel fayl
const SHOW_HIDDEN_SHEETS = false;        // true — Excel'da yashirilgan varaqlar ham ko'rinadi
const ALWAYS_SHOW = ['BANDLIK INDEKSI']; // yashirin bo'lsa ham ko'rsatiladigan varaqlar (bosh sahifa)
/* ==================================================================== */

const C = {green:'#22c55e', amber:'#f59e0b', red:'#ef4444', blue:'#3b82f6', blue2:'#60a5fa', violet:'#a78bfa', cyan:'#22d3ee', pink:'#f472b6',
           grid:'rgba(148,163,184,.12)', muted:'#8b98ad', card:'#111827', track:'rgba(148,163,184,.14)'};
Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
Chart.defaults.font.size = 12;
Chart.defaults.color = C.muted;
Chart.defaults.borderColor = C.grid;
Object.assign(Chart.defaults.plugins.legend.labels, {boxWidth:10, boxHeight:10});
Object.assign(Chart.defaults.plugins.tooltip, {padding:10, backgroundColor:'#0b1220', borderColor:'rgba(148,163,184,.25)', borderWidth:1});

/* ---------- yordamchilar ---------- */
const $ = s => document.querySelector(s);
const key = v => String(v ?? '').replace(/[‘’ʻʼ`´]/g,"'").replace(/\s+/g,' ').trim().toLowerCase();
const num = v => (typeof v === 'number' && isFinite(v)) ? v : (typeof v === 'string' && v.trim() !== '' && !isNaN(+v) ? +v : null);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fI = v => v == null ? '—' : Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const fD = (v, d=2) => v == null ? '—' : v.toFixed(d).replace('.', ',');
const fP = (v, d=1) => v == null ? '—' : (v*100).toFixed(d).replace('.', ',') + '%';
const clean = s => String(s ?? '').replace(/\s+/g,' ').trim();
const idxColor = p => p >= .7 ? C.green : p >= .6 ? C.amber : C.red;
const shortName = s => String(s||'').replace(/ ilmiy-tadqiqot instituti/i,' ITI').replace(/ dasturlarini muvofiqlashtirish bo.limi/i,' dasturlari')
  .replace(/ va intellektual muhandislik texnologiyalari/i,' va int. muhandislik').replace(/ va agrobiologiya tibbiyot/i,' va agrobiologiya');
const cut = (l, n) => l.length > n ? l.slice(0, n-1) + '…' : l;
let WB, PAGES = [], charts = {}, ST = {level:0};

function rows(name){
  const k = key(name);
  const n = WB.SheetNames.find(s => key(s) === k) || WB.SheetNames.find(s => key(s).startsWith(k));
  return n ? XLSX.utils.sheet_to_json(WB.Sheets[n], {header:1, raw:true, defval:null}) : null;
}
function findRow(a, test, from=0, to=60){ for (let i=from; i<Math.min(a.length,to); i++){ if ((a[i]||[]).some(v => test(key(v)))) return i; } return -1; }
function col(hdr, test, from=0){ for (let i=Math.max(from,0); i<hdr.length; i++) if (test(key(hdr[i]))) return i; return -1; }
const has = t => k => k.includes(t), starts = t => k => k.startsWith(t), is = t => k => k === t;
function mk(id, cfg){ if (charts[id]) charts[id].destroy(); const el = document.getElementById(id); if (el) charts[id] = new Chart(el, cfg); }

/* ============================ YUKLASH ============================ */
async function loadRemote(){
  try{
    const res = await fetch(DATA_URL + '?v=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    start(XLSX.read(await res.arrayBuffer(), {type:'array', cellDates:true, cellStyles:true, bookFiles:true}), DATA_URL);
  }catch(e){ showError("Serverdagi <b>" + DATA_URL + "</b> faylni o'qib bo'lmadi (" + esc(e.message) + "). Excel faylni qo'lda tanlang."); }
}
function loadFile(file){
  const fr = new FileReader();
  fr.onload = ev => { try{ start(XLSX.read(new Uint8Array(ev.target.result), {type:'array', cellDates:true, cellStyles:true, bookFiles:true}), file.name); }catch(e){ showError(esc(e.message)); } };
  fr.readAsArrayBuffer(file);
}
function showError(msg){
  $('#overlay').classList.remove('hidden');
  $('#ovBox').innerHTML = '<h2>Ma\'lumot topilmadi</h2><p>' + msg + '</p><label class="btn pri">Excel faylni tanlash<input type="file" accept=".xlsx,.xls" hidden onchange="this.files[0]&&loadFile(this.files[0])"></label>';
}
$('#fileInp').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value=''; });

function start(wb, name){
  WB = wb;
  try{
    initStyles();
    ST.bi = parseBI(); ST.nn = parseNN();
    buildPages();
    if (!PAGES.length) throw new Error("Excel faylda varaq topilmadi.");
    $('#fileName').textContent = name;
    if (ST.bi){
      const m = ST.bi.title.match(/(\d{4}\/\d{4}-o.quv yili)\s+(.+?)\s+BAKALAVR/i);
      if (m) $('#otm').textContent = m[2].charAt(0) + m[2].slice(1).toLowerCase();
      const d = ST.bi.date ? ST.bi.date.toLocaleDateString('ru-RU') : '—';
      $('#date').textContent = d; $('#date2').textContent = d;
    }
    renderNav(); route();
  }catch(e){ console.error(e); showError(esc(e.message)); return; }
  $('#overlay').classList.add('hidden');
}

/* ============================ SAHIFALAR (varaqlar) ============================ */
const ICON = {
  overview:'<path d="M3 3v18h18"/><path d="m7 14 4-4 4 4 5-6"/>',
  kunlik:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  tuman:'<path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  viloyat:'<path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  nomma:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  kafedra:'<path d="M3 21h18M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/>',
  kafidx:'<circle cx="12" cy="8" r="6"/><path d="M15.5 13.5 17 22l-5-3-5 3 1.5-8.5"/>',
  facidx:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  ozini:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>',
  ishband:'<path d="M3 6h18M7 12h10M10 18h4"/>',
  table:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>'
};
function kindOf(n){
  const k = key(n);
  if (k.startsWith('bandlik indeksi')) return 'overview';
  if (k.startsWith('kunlik')) return 'kunlik';

const isJunk = s => /^(barchasi|\*|<>@@|<>\*)$/i.test(s) || /\bfiltr|kriteriy|^🔎|^📍|viloyat\s*▼/i.test(s);
const CUT_BELOW = ['Kafedralar', 'Kafedralar indeksi'];   // asosiy jadvaldan pastdagi yozuvlar ko'rsatilmaydi
function hexLum(h){ const [r,g,b] = h2r(h); return (0.2126*r + 0.7152*g + 0.0722*b)/255; }
function fillOf(x){ const s = x && x.s; if (!s || s.patternType !== 'solid' || !s.fgColor || !s.fgColor.rgb) return null; const h = String(s.fgColor.rgb).slice(-6); return /^[0-9a-f]{6}$/i.test(h) ? h : null; }

function sheetModel(name, opt={}){
  const ws = WB.Sheets[name]; if (!ws || !ws['!ref']) return null;
  const R = XLSX.utils.decode_range(ws['!ref']);
  const hc = ws['!cols'] || [], hr = ws['!rows'] || [];
  const enc = (r,c) => XLSX.utils.encode_cell({r,c});
  const ov = opt.ov || null;
  const at = (r,c) => {
    const k = r*100000 + c;
    if (ov && ov.has(k)){
      const v = ov.get(k), base = ws[enc(r,c)];
      if (v == null || v === '') return {v:'', t:'s', w:'', s: base && base.s};
      const z = base && base.z;
      let w = String(v); if (typeof v === 'number'){ try{ w = z ? XLSX.SSF.format(z, v) : String(v); }catch(e){} }
      return {v, t: typeof v === 'number' ? 'n' : 's', z, w, s: base && base.s};
    }
    return ws[enc(r,c)];
  };
  const getv = (r,c) => { const x = at(r,c); if (!x || x.v === undefined || x.v === null || x.t === 'z') return null; return x.v instanceof Date ? x.v.getTime() : x.v; };
  const textOf = x => x.t === 'd' && x.v instanceof Date ? x.v.toLocaleDateString('ru-RU') : String(x.w ?? x.v);
  const filled = x => !!x && x.v != null && String(x.v).trim() !== '' && !(x.t === 's' && isJunk(clean(textOf(x))));
  const cover = new Map();
  (ws['!merges'] || []).forEach(m => { for (let r=m.s.r; r<=m.e.r; r++) for (let c=m.s.c; c<=m.e.c; c++) cover.set(r*100000+c, m); });
  const mOf = (r,c) => cover.get(r*100000+c);
  const hasV = (r,c) => filled(at(r,c)) || (() => { const m = mOf(r,c); return !!m && filled(at(m.s.r, m.s.c)); })();
  let vr = []; for (let r=R.s.r; r<=R.e.r; r++) if (!(hr[r] && hr[r].hidden)) vr.push(r);
  const vc = []; for (let c=R.s.c; c<=R.e.c; c++) if (!(hc[c] && hc[c].hidden)) vc.push(c);
  let hdr = vr.find(r => vc.filter(c => filled(at(r,c))).length >= 3); if (hdr == null) hdr = vr[0];
  // kafedralar: asosiy jadvaldan pastdagi izoh/tekshiruv/ko'chirish bloklari olib tashlanadi
  if (CUT_BELOW.some(n => key(n) === key(name))){
    let seen = false, end = null;
    for (const r of vr){
      if (r <= hdr) continue;
      const f = vc.filter(c => filled(at(r,c)));
      if (f.some(c => at(r,c).t === 'n')) seen = true;
      const first = f.length ? clean(textOf(at(r, f.find(c => at(r,c).t !== 'n') ?? f[0]))) : '';
      if (seen && /^(tekshiruv|asos|eslatma|izoh|kafedralar o.rtasida)/i.test(first)){ end = r; break; }
    }
    if (end != null) vr = vr.filter(r => r < end);
  }
  const after = vr.filter(r => r >= hdr);
  let keep = [], begun = false;
  for (const c of vc){ const n = after.filter(r => hasV(r,c)).length; if (!begun){ if (n) begun = true; else continue; } if (!n) break; keep.push(c); }
  keep = keep.filter(c => after.some(r => r > hdr && hasV(r,c)));
  if (!keep.length) return null;
  const c0 = keep[0], c1 = keep[keep.length-1];
  const lines = [];
  vr.filter(r => r < hdr).forEach(r => {
    const t = []; for (let c=c0; c<=c1; c++){ if (hc[c] && hc[c].hidden) continue; const x = at(r,c); if (filled(x)) t.push(clean(textOf(x))); }
    if (t.length) lines.push({r, text:t.join(' · ')});
  });
  const title = lines[0] ? lines[0].text : '';
  let subtitle = '', pre = lines.slice(1);
  if (pre[0] && pre[0].text.length > 40){ subtitle = pre[0].text; pre = pre.slice(1); }
  const out = pre.map(l => ({kind:'sec', r:l.r, text:l.text}));
  let prev = 'start';
  after.forEach(r => {
    const f = keep.filter(c => filled(at(r,c)));
    if (!f.length){ if (prev !== 'sp' && prev !== 'start') out.push({kind:'sp', r}); prev = 'sp'; return; }
    const nums = f.filter(c => at(r,c).t === 'n').length;
    const dark = f.some(c => { const h = fillOf(at(r,c)); return h && hexLum(h) < .45; });
    const texts = f.map(c => clean(textOf(at(r,c))));
    let kind;
    if (!nums){
      if (f.length <= 2) kind = /^(asos|✓|tekshiruv|izoh\b|eslatma)/i.test(texts[0]) ? 'note' : 'sec';
      else kind = (dark || ['start','sp','sec','note'].includes(prev)) ? 'head' : 'data';
    } else kind = (dark || /^(jami|umumiy|universitet umumiy)/i.test(texts.find(t => isNaN(+t)) || '')) ? 'tot' : 'data';
    out.push({kind, r, text: (kind === 'sec' || kind === 'note') ? texts.join(' — ') : ''});
    prev = kind;
  });
  while (out.length && out[out.length-1].kind === 'sp') out.pop();
  const sx = sheetXS(name);
  const widths = keep.map(c => { const w = hc[c] || {}; const px = w.wpx || (w.wch ? w.wch * 7 + 10 : (w.width ? w.width * 7 : 0)); return px ? Math.max(40, Math.min(px, 420)) : null; });
  return {name, ws, at, getv, filled, mOf, keep, rows:out, title, subtitle, textOf, sx, xl: !!sx, widths};
}

function cellHtml(M, r, c, x, kind, span=''){
  const isN = !!x && M.filled(x) && x.t === 'n';
  let txt = '', cls = isN ? 'n' : 't';
  if (M.filled(x)){
    if (isN){
      if (!x.z || x.z === 'General') txt = Number.isInteger(x.v) ? fI(x.v) : String(+x.v.toFixed(3)).replace('.', ',');
      else txt = String(x.w ?? x.v).replace(/,/g,'\u0001').replace(/\./g,',').replace(/\u0001/g,' ');
    } else { const t = M.textOf(x); txt = esc(t).replace(/\n/g,'<br>'); if (t.length > 30) cls += ' w'; }
  }
  if (!M.xl){
    let st = '';
    if (kind === 'data'){ const h = fillOf(x); if (h && h.toUpperCase() !== 'FFFFFF' && hexLum(h) >= .45) st = ` style="background:rgba(${h2r(h).join(',')},.09)"`; }
    return `<td class="${cls}"${span}${st}>${txt}</td>`;
  }
  // Excel'dagi ranglar: katak uslubi + shartli formatlash
  const xf = XS.xfs[M.sx.sIdx.get(XLSX.utils.encode_cell({r,c})) || 0] || XS.xfs[0];
  const cf = cfStyle(M, r, c) || {};
  const bg = cf.fill !== undefined ? cf.fill : (xf && xf.fill) || 'FFFFFF';
  let fc = cf.color !== undefined ? cf.color : (xf && xf.font && xf.font.color) || XS.defColor;
  const bold = cf.b !== undefined ? cf.b : !!(xf && xf.font && xf.font.b);
  if (hexLum(bg) < .45 && hexLum(fc || '000000') < .35) fc = 'FFFFFF';
  if (hexLum(bg) > .6 && hexLum(fc || '000000') > .85) fc = '000000';
  let al = xf && xf.h; al = al === 'centerContinuous' || al === 'center' ? 'center' : al === 'right' ? 'right' : al === 'left' ? 'left' : (isN ? 'right' : 'left');
  let style = `color:#${fc};text-align:${al};`;
  if (cf.bar){ const p = (cf.bar.t * 100).toFixed(1); style += `background:linear-gradient(90deg,#${cf.bar.color} ${p}%,#${bg} ${p}%);`; }
  else style += `background:#${bg};`;
  if (bold) style += 'font-weight:700;';
  if (xf && xf.font && xf.font.i) style += 'font-style:italic;';
  return `<td class="${cls}"${span} style="${style}">${txt}</td>`;
}
function drawSheetTable(M){
  const box = $('#xl'), q = $('#xlQ'), W = M.keep.length;
  box.classList.toggle('xs', M.xl);
  const isCellRow = o => M.xl ? o.kind !== 'sp' : ['head','data','tot'].includes(o.kind);
  const tableRows = M.rows.filter(isCellRow).map(o => o.r);
  const colg = M.xl ? `<colgroup>${M.widths.map(w => w ? `<col style="width:${w}px">` : '<col>').join('')}</colgroup>` : '';
  const anchorCell = (r, c) => { const m = M.mOf(r, c); return m ? [m.s.r, m.s.c] : [r, c]; };
  const draw = () => {
    M._st = null;
    const query = key(q.value);
    let html = '', shown = 0, total = 0;
    if (!query){
      M.rows.forEach(o => {
        if (o.kind === 'sp'){ html += `<tr class="sp"><td colspan="${W}"></td></tr>`; return; }
        if (!isCellRow(o)){ html += `<tr class="${o.kind}"><td colspan="${W}">${esc(o.text)}</td></tr>`; return; }
        if (o.kind === 'data') total++;
        let tds = '';
        M.keep.forEach(c => {
          const m = M.mOf(o.r, c);
          if (m){
            const ac = M.keep.find(cc => cc >= m.s.c && cc <= m.e.c), ar = tableRows.find(rr => rr >= m.s.r && rr <= m.e.r);
            if (c !== ac || o.r !== ar) return;
            const cs = M.keep.filter(cc => cc >= m.s.c && cc <= m.e.c).length, rs = tableRows.filter(rr => rr >= m.s.r && rr <= m.e.r).length;
            tds += cellHtml(M, m.s.r, m.s.c, M.at(m.s.r, m.s.c), o.kind, (cs > 1 ? ` colspan="${cs}"` : '') + (rs > 1 ? ` rowspan="${rs}"` : ''));
          } else tds += cellHtml(M, o.r, c, M.at(o.r, c), o.kind);
        });
        html += `<tr class="${o.kind}">${tds}</tr>`;
      });
      shown = total;
    } else {
      let heads = [], emitted = false;
      const flat = (r, kind) => M.keep.map(c => {
        const m = M.mOf(r, c);
        if (m && c !== M.keep.find(cc => cc >= m.s.c && cc <= m.e.c)) return cellHtml(M, r, c, null, kind);
        const [ar, acol] = anchorCell(r, c); return cellHtml(M, ar, acol, M.at(ar, acol), kind);
      }).join('');
      const rowText = r => M.keep.map(c => { const [ar, acol] = anchorCell(r, c), x = M.at(ar, acol); return M.filled(x) ? M.textOf(x) : ''; }).join(' ');
      M.rows.forEach(o => {
        if (o.kind === 'head'){ if (emitted){ heads = []; emitted = false; } heads.push(o.r); return; }
        if (o.kind !== 'data') return;
        total++;
        if (!key(rowText(o.r)).includes(query)) return;
        if (!emitted){ heads.forEach(h => html += `<tr class="head">${flat(h, 'head')}</tr>`); emitted = true; }
        html += `<tr class="data">${flat(o.r, 'data')}</tr>`; shown++;
      });
      if (!shown) html = `<tr><td class="empty" colspan="${W}">"${esc(q.value)}" bo'yicha hech narsa topilmadi</td></tr>`;
    }
    box.innerHTML = `<table>${colg}${html}</table>`;
    const firstData = box.querySelector('tr.data');
    const hs = []; for (let tr = firstData && firstData.previousElementSibling; tr && tr.classList.contains('head'); tr = tr.previousElementSibling) hs.push(tr);
    box.classList.toggle('tall', total > 60);
    if (total > 60 && hs.length === 1) hs[0].classList.add('stk');
    $('#xlCnt').textContent = query ? `${shown} / ${total} qator` : `${total} qator`;
  };
  q.classList.remove('hidden');
  q.oninput = draw; draw();
}

                 ['Iqtisodiy nofaol', t.nofaol, p(t.nofaol), C.violet], ["O'zini band qilgan", t.ozini, p(t.ozini), C.amber], ['Ishsizlar (career.edu.uz)', t.ish, t.ishP ?? p(t.ish), C.red]];
      $('#kpis').innerHTML = K.map(([l,v,s,a]) => `<div class="kpi" style="--acc:${a}"><div class="lbl">${l}</div><div class="val">${fI(v)}</div><div class="sub">${s==null?'diplom olganlar':'<b>'+fP(s, a===C.red?2:1)+'</b> jami ichida'}</div></div>`).join('');
      const idx = t.idx ?? 0, pc = t.pct ?? idx/30;
      $('#idxVal').textContent = fD(idx); $('#idxPct').textContent = fP(pc);
      mk('chIndex', {type:'doughnut', data:{datasets:[{data:[idx, Math.max(30-idx,0)], backgroundColor:[idxColor(pc), C.track], borderWidth:0}]},
        options:{cutout:'80%', responsive:true, maintainAspectRatio:false, rotation:-135, circumference:270, plugins:{legend:{display:false}, tooltip:{enabled:false}}}});
      $('#comp').innerHTML = [['Nufuz (21-ball)', t.b21, 5, C.violet], ['Bandlik (22-ball)', t.b22, 15, C.green], ['Ishga joylashish muddati (23-ball)', t.b23, 5, C.cyan], ['Daromad (24-ball)', t.b24, 5, C.amber]]
        .map(([l,v,mx,cl]) => `<div><div class="h"><span>${l}</span><b>${fD(v)} <span>/ ${mx}</span></b></div><div class="track"><div class="fill" style="width:${Math.min((v||0)/mx*100,100)}%;background:${cl}"></div></div></div>`).join('');
      const oc = t.oylik == null ? C.muted : t.oylik < bi.lo ? C.red : t.oylik > bi.hi ? C.green : C.amber;
      $('#coefs').innerHTML = [['K4.2 bandlik', fD(t.k42), '/ 2'], ['K4.3 muddat', fD(t.k43), '/ 3'], ['K4.4 daromad', fD(t.k44), ''], ["O'rtacha oylik", `<span style="color:${oc}">${fI(t.oylik)}</span>`, "so'm"]]
        .map(([a,b,s]) => `<div class="coef"><div class="t">${a}</div><div class="v">${b} <small>${s}</small></div></div>`).join('');
      const parts = [["Bandligi ta'minlangan", t.band, C.green], ["O'qishni davom ettirmoqda", t.oqish, C.cyan], ['Iqtisodiy nofaol', t.nofaol, C.violet], ["O'zini band qilgan", t.ozini, C.amber], ['Ishsizlar', t.ish, C.red]].filter(x => x[1] != null);
      mk('chStruct', {type:'doughnut', data:{labels:parts.map(x=>x[0]), datasets:[{data:parts.map(x=>x[1]), backgroundColor:parts.map(x=>x[2]), borderColor:C.card, borderWidth:3}]},
        options:{cutout:'62%', responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}, tooltip:{callbacks:{label:c => ` ${c.label}: ${fI(c.raw)} (${fP(J?c.raw/J:0)})`}}}}});
    };
    top();
    const F = parseIndexSheet('Fakultetlar indeksi', 'fakultet');
    if (F) indexStack('chFac', F.sort((a,b) => (a.rank ?? 99) - (b.rank ?? 99))); else $('#facWrap').classList.add('hidden');
  },

  kunlik(V, p){
    const D = parseDailySheet(p.name); if (!D.blocks.length) return;
    const nice = s => { s = s.toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };
    const cards = D.blocks.map((b, i) => {
      const ni = b.cols.findIndex((c,j) => j > 0 && b.tot && b.tot[j] != null && !key(c.t).startsWith("o'zgarish"));
      const oldV = b.tot ? b.tot[0] : null, newV = b.tot ? b.tot[ni < 0 ? 1 : ni] : null, d = (oldV != null && newV != null) ? newV - oldV : null;
      const dates = b.cols.slice(0,2).map(c => (c.t.match(/\d{2}\.\d{2}\.\d{2,4}/) || [''])[0]);
      return `<div class="kpi" style="--acc:${[C.red, C.amber, C.violet][i % 3]}"><div class="lbl">${esc(nice(b.title))}</div><div class="val">${fI(newV)}${d != null ? `<span class="chg ${d < 0 ? 'down' : d > 0 ? 'up' : 'eq'}">${d > 0 ? '+' : ''}${fI(d)}</span>` : ''}</div><div class="sub">${dates[1] ? esc(dates[1]) + ' holatiga' : ''}${dates[0] ? ' · ' + esc(dates[0]) + ' da: <b>' + fI(oldV) + '</b>' : ''}</div></div>`;
    }).join('');
    V.innerHTML = `<section class="kpis">${cards}</section>
      <section class="grid"><div class="card s12"><h3>Fakultetlar kesimida (oxirgi sana)</h3><p class="hint">${esc(D.label)} · ishsiz va o'zini band qilganlar soni</p><div class="chart" style="height:340px"><canvas id="chDay"></canvas></div></div></section>`;
    const ish = D.blocks[0], oz = D.blocks.find((b,i) => i > 0 && !/\+/.test(b.title));
    const last = b => { const j = b.cols.findIndex((c,jj) => jj > 0 && !key(c.t).startsWith("o'zgarish")); return j < 0 ? 1 : j; };
    const names = ish.rows.map(r => r.name);
    const val = (b, n) => { if (!b) return 0; const r = b.rows.find(x => key(x.name) === key(n)); return r ? (r.v[last(b)] || 0) : 0; };
    names.sort((a,b) => (val(ish,b)+val(oz,b)) - (val(ish,a)+val(oz,a)));
    const ds = [{label:nice(ish.title), data:names.map(n => val(ish, n)), backgroundColor:C.red, stack:'s'}];
    if (oz) ds.push({label:nice(oz.title), data:names.map(n => val(oz, n)), backgroundColor:C.amber, stack:'s', borderRadius:{topLeft:4, topRight:4}});
    mk('chDay', {type:'bar', data:{labels:names.map(shortName), datasets:ds}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}, tooltip:{callbacks:{title:it => names[it[0].dataIndex]}}},
      scales:{x:{stacked:true, grid:{display:false}, border:{display:false}, ticks:{autoSkip:false, maxRotation:45, callback(v){ return cut(this.getLabelForValue(v), 22); }}}, y:{stacked:true, grid:{color:C.grid}, border:{display:false}}}}});
  },

  tuman(V, p){
    const T = parseCounts(p.name, 'tuman'); if (!T) return;
    const rws = T.slice().sort((a,b) => (b.jami||0) - (a.jami||0));
    V.innerHTML = `<section class="grid"><div class="card s12"><h3>Tumanlar kesimida bitiruvchilar</h3><p class="hint">Bandlik holati bo'yicha, jami soni kamayish tartibida</p><div class="chart" style="height:320px"><canvas id="chTum"></canvas></div></div></section>`;
    stackedStatus('chTum', rws, r => r.name.replace(' tumani','').replace(' shahri',' sh.'), false);
  },

  viloyat(V, p){
    const T = parseCounts(p.name, 'viloyat nomi'); if (!T) return;
    const rws = T.slice().sort((a,b) => (b.bandP||0) - (a.bandP||0));
    V.innerHTML = `<section class="grid">
      <div class="card s6"><h3>Bandlik darajasi</h3><p class="hint">Bandligi ta'minlanganlar ulushi, %</p><div class="chart" style="height:380px"><canvas id="chVb"></canvas></div></div>
      <div class="card s6"><h3>Ishsiz + o'zini band ulushi</h3><p class="hint">Jami bitiruvchilarga nisbatan, %</p><div class="chart" style="height:380px"><canvas id="chVi"></canvas></div></div></section>`;
    const pctBar = (id, arr, f, color) => mk(id, {type:'bar', data:{labels:arr.map(r => r.name.replace(' viloyati','')), datasets:[{data:arr.map(r => +((f(r)||0)*100).toFixed(1)), backgroundColor:arr.map(color), borderRadius:5, maxBarThickness:18}]},
      options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ' ' + String(c.raw).replace('.',',') + '%'}}}, scales:{x:{grid:{color:C.grid}, border:{display:false}, ticks:{callback:v => v + '%'}}, y:{grid:{display:false}, border:{display:false}}}}});
    pctBar('chVb', rws, r => r.bandP, r => r.bandP >= .75 ? C.green : r.bandP >= .65 ? C.amber : C.red);
    const r2 = T.slice().sort((a,b) => (b.ishOzP||0) - (a.ishOzP||0));
    pctBar('chVi', r2, r => r.ishOzP, () => C.amber);
  },

  nomma(V){
    const N = ST.nn; if (!N) return;
    const oz = N.filter(r => r.oz), un = N.filter(r => !r.oz), ch = un.filter(r => r.izoh);
    V.innerHTML = `<section class="kpis">
        <div class="kpi" style="--acc:${C.blue2}"><div class="lbl">Ro'yxatdagilar</div><div class="val">${fI(N.length)}</div><div class="sub">ishsiz va o'zini band qilganlar</div></div>
        <div class="kpi" style="--acc:${C.red}"><div class="lbl">Ishsizlar</div><div class="val">${fI(un.length)}</div><div class="sub"><b>${fI(ch.length)}</b> nafari harbiy / xorij / homilador</div></div>
        <div class="kpi" style="--acc:${C.amber}"><div class="lbl">O'zini band qilganlar</div><div class="val">${fI(oz.length)}</div><div class="sub"><b>${cnt(oz, r => r.act).length}</b> ta faoliyat turi</div></div></section>
      <section class="grid">
        <div class="card s7"><h3>O'zini band qilganlar — faoliyat turlari</h3><p class="hint">Eng ko'p uchraydigan 15 tasi</p><div class="chart" style="height:420px"><canvas id="chAct"></canvas></div></div>
        <div class="card s5"><h3>Ishsizlar holati</h3><p class="hint">IZOH ustuni bo'yicha</p><div class="chart" style="height:420px"><canvas id="chUn"></canvas></div></div>
        <div class="card s12"><h3>Fakultetlar bo'yicha</h3><p class="hint">Ishsiz va o'zini band qilganlar soni</p><div class="chart" style="height:320px"><canvas id="chNnFac"></canvas></div></div></section>`;
    const top = cnt(oz, r => r.act || "Ko'rsatilmagan").slice(0, 15);
    mk('chAct', {type:'bar', data:{labels:top.map(x=>x[0]), datasets:[{data:top.map(x=>x[1]), backgroundColor:C.amber, borderRadius:5, maxBarThickness:18}]},
      options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{title:it => top[it[0].dataIndex][0]}}},
        scales:{x:{grid:{color:C.grid}, border:{display:false}}, y:{grid:{display:false}, border:{display:false}, ticks:{callback(v){ return cut(this.getLabelForValue(v), innerWidth < 640 ? 22 : 42); }}}}}});
    const iz = cnt(un, r => r.izoh || 'Ishsiz (izohsiz)'), pal = [C.red, C.pink, C.violet, C.cyan, C.blue2, C.amber];
    mk('chUn', {type:'doughnut', data:{labels:iz.map(x=>x[0]), datasets:[{data:iz.map(x=>x[1]), backgroundColor:iz.map((x,i)=>pal[i%pal.length]), borderColor:C.card, borderWidth:3}]},
      options:{cutout:'60%', responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}, tooltip:{callbacks:{label:c => ` ${c.label}: ${fI(c.raw)} (${fP(c.raw/un.length)})`}}}}});
    const facs = cnt(N, r => r.fac).map(x => x[0]);
    mk('chNnFac', {type:'bar', data:{labels:facs.map(shortName), datasets:[
        {label:'Ishsiz', data:facs.map(f => un.filter(r=>r.fac===f).length), backgroundColor:C.red, borderRadius:4},
        {label:"O'zini band", data:facs.map(f => oz.filter(r=>r.fac===f).length), backgroundColor:C.amber, borderRadius:4}]},
      options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}, tooltip:{callbacks:{title:it => facs[it[0].dataIndex]}}},
        scales:{x:{grid:{display:false}, border:{display:false}, ticks:{maxRotation:45, autoSkip:false, callback(v){ return cut(this.getLabelForValue(v), 22); }}}, y:{grid:{color:C.grid}, border:{display:false}}}}});
  },

  kafedra(V, p){
    const K = parseCounts(p.name, 'kafedra'); if (!K) return;
    const rws = K.slice().sort((a,b) => (b.bandP||0) - (a.bandP||0));
    V.innerHTML = `<section class="grid"><div class="card s12"><h3>Kafedralar kesimida bitiruvchilar</h3><p class="hint">Bandlik darajasi bo'yicha tartiblangan</p><div class="chart" style="height:${Math.max(360, rws.length*24+80)}px"><canvas id="chKaf"></canvas></div></div></section>`;
    stackedStatus('chKaf', rws, r => r.name, true);
  },

  kafidx(V, p){
    const K = parseIndexSheet(p.name, 'kafedra'); if (!K) return;
    const rws = K.sort((a,b) => (a.rank ?? 99) - (b.rank ?? 99));
    V.innerHTML = `<section class="grid"><div class="card s12"><h3>Kafedralar reytingi</h3><p class="hint">Bitiruvchilar indeksi, 30 balldan · reyting tartibida</p><div class="chart" style="height:${Math.max(360, rws.length*24+80)}px"><canvas id="chKi"></canvas></div></div></section>`;
    indexStack('chKi', rws);
  },

  facidx(V, p){
    const F = parseIndexSheet(p.name, 'fakultet'); if (!F) return;
    V.innerHTML = `<section class="grid"><div class="card s12"><h3>Fakultetlar reytingi</h3><p class="hint">Bitiruvchilar indeksi, 30 balldan · reyting tartibida</p><div class="chart" style="height:360px"><canvas id="chFi"></canvas></div></div></section>`;
    indexStack('chFi', F.sort((a,b) => (a.rank ?? 99) - (b.rank ?? 99)));
  },

  ozini(V, p){
    const N = ST.nn, ws = WB.Sheets[p.name];
    const a = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
    const h = findRow(a, is('faoliyat turi'));
    if (!N || h < 0){ const M = sheetModel(p.name); if (M) drawSheetTable(M); else $('#xlCard').classList.add('hidden'); return; }
    V.innerHTML = `<div class="row"><div class="tools">${vilSelect('ozVil')}</div><span class="cnt" id="ozCnt"></span></div>
      <section class="grid"><div class="card s12"><h3>Eng ko'p uchraydigan faoliyat turlari</h3><p class="hint">Fakultetlar kesimida (eng ko'p 12 tasi)</p><div class="chart" style="height:420px"><canvas id="chOz"></canvas></div></div></section>`;
    const H = a[h], ca = col(H, is('faoliyat turi')), cj = col(H, is('jami'), ca + 1);
    const facCols = []; for (let c = ca + 1; c < (cj < 0 ? H.length : cj); c++) if (clean(H[c])) facCols.push({c, name: clean(H[c])});
    const jr = h + 1, r0 = jr + 1; let r1 = r0;
    for (let r = r0; r < a.length; r++){ const row = a[r] || []; if (num(row[ca-1]) != null || facCols.some(f => num(row[f.c]) != null) || num(row[cj]) != null) r1 = r; }
    let info = null, tcell = null;
    for (let r = 0; r < h; r++) (a[r] || []).forEach((v, c) => { if (typeof v !== 'string') return; if (/^jami:/i.test(v.trim())) info = [r, c]; else if (!tcell && v.length > 40) tcell = [r, c, v]; });
    const K = (r, c) => r * 100000 + c, actName = r => r.act || "Ko'rsatilmagan";
    const draw = () => {
      const v = $('#ozVil').value;
      const oz = N.filter(r => r.oz && (!v || r.vil === v));
      const acts = cnt(oz, actName), ov = new Map();
      const fc = (list, f) => list.filter(x => key(x.fac) === key(f.name)).length;
      facCols.forEach(f => ov.set(K(jr, f.c), fc(oz, f))); if (cj >= 0) ov.set(K(jr, cj), oz.length);
      for (let r = r0; r <= r1; r++){
        const A = acts[r - r0];
        if (A){ const L = oz.filter(x => actName(x) === A[0]); ov.set(K(r, ca-1), r - r0 + 1); ov.set(K(r, ca), A[0]); facCols.forEach(f => ov.set(K(r, f.c), fc(L, f))); if (cj >= 0) ov.set(K(r, cj), A[1]); }
        else { [ca-1, ca, ...facCols.map(f => f.c), cj].forEach(c => c >= 0 && ov.set(K(r, c), '')); }
      }
      if (info) ov.set(K(info[0], info[1]), `Jami: ${oz.length} kishi · ${acts.length} ta faoliyat turi`);
      if (tcell) ov.set(K(tcell[0], tcell[1]), v ? tcell[2].replace(/\(barcha viloyatlar\)/i, `(${v})`) : tcell[2]);
      const M = sheetModel(p.name, {ov}); setHeader(M);
      $('#ozCnt').textContent = `Jami: ${fI(oz.length)} kishi · ${acts.length} ta faoliyat turi`;
      $('#xlHint').textContent = (v ? `${v} · ` : '') + "Excel'dagi jadval ranglari bilan (faoliyat nomlari Nomma-nom ro'yxatidan)";
      if (M) drawSheetTable(M);
      const top = acts.slice(0, 12).map(x => x[0]);
      const pal = [C.blue, C.green, C.amber, C.violet, C.cyan, C.pink, '#a3e635', '#fb923c', '#818cf8', '#2dd4bf', '#fb7185', '#94a3b8'];
      mk('chOz', {type:'bar', data:{labels:top, datasets:facCols.map((f,i) => ({label:shortName(f.name), data:top.map(t => oz.filter(x => actName(x) === t && key(x.fac) === key(f.name)).length), backgroundColor:pal[i % pal.length], stack:'s'}))},
        options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{font:{size:11}}}},
          scales:{x:{stacked:true, grid:{color:C.grid}, border:{display:false}}, y:{stacked:true, grid:{display:false}, border:{display:false}, ticks:{callback(v){ return cut(this.getLabelForValue(v), innerWidth < 640 ? 20 : 40); }}}}}});
    };
    $('#ozVil').onchange = draw; draw();
  },

  ishband(V, p){
    const N = ST.nn, ws = WB.Sheets[p.name];
    const a = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:null});
    const h = findRow(a, is("ta'lim yo'nalishi"));
    if (!N || h < 0){ const M = sheetModel(p.name); if (M) drawSheetTable(M); else $('#xlCard').classList.add('hidden'); return; }
    V.innerHTML = `<div class="row"><div class="tools">${vilSelect('ibVil')}</div></div>
      <section class="grid"><div class="card s12"><h3>Fakultetlar kesimida</h3><p class="hint">Ishsizlar (harbiy, xorij, homilador chiqarilgan) va o'zini band qilganlar</p><div class="chart" style="height:320px"><canvas id="chIb"></canvas></div></div></section>`;
    const H = a[h], cB = col(H, has("ta'lim yo'nalishi")), cA = cB - 1;
    const cs = [col(H, starts('ishsizlar (jami')), col(H, starts('chiqarilgan')), col(H, starts('ishsizlar (chiqarilgan')), col(H, starts("o'zini band")), col(H, is('jami'))];
    let tcell = null; for (let r = 0; r < h && !tcell; r++) (a[r] || []).forEach((v, c) => { if (!tcell && typeof v === 'string' && v.length > 40) tcell = [r, c, v]; });
    const st = arr => { const ish = arr.filter(r => !r.oz).length, chq = arr.filter(r => !r.oz && r.izoh).length, oz = arr.filter(r => r.oz).length; return [ish, chq, ish - chq, oz, ish - chq + oz]; };
    const draw = () => {
      const v = $('#ibVil').value, L = N.filter(r => !v || r.vil === v);
      const facs = cnt(L, r => r.fac).map(x => x[0]);
      mk('chIb', {type:'bar', data:{labels:facs.map(shortName), datasets:[
          {label:'Ishsizlar (chiqarilgan)', data:facs.map(f => st(L.filter(r => r.fac === f))[2]), backgroundColor:C.red, stack:'s'},
          {label:"O'zini band qilgan", data:facs.map(f => st(L.filter(r => r.fac === f))[3]), backgroundColor:C.amber, stack:'s', borderRadius:{topLeft:4, topRight:4}}]},
        options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}, tooltip:{callbacks:{title:it => facs[it[0].dataIndex]}}},
          scales:{x:{stacked:true, grid:{display:false}, border:{display:false}, ticks:{autoSkip:false, maxRotation:45, callback(v){ return cut(this.getLabelForValue(v), 22); }}}, y:{stacked:true, grid:{color:C.grid}, border:{display:false}}}}});
      let ov = null;
      if (v){
        ov = new Map(); let fac = '';
        for (let r = h + 1; r < a.length; r++){
          const row = a[r] || [], b = clean(row[cB]); if (!b) continue;
          if (/^(tekshiruv|asos)/i.test(b)) break;
          let list;
          if (key(b) === 'jami') list = L;
          else if (num(row[cA]) != null){ fac = b; list = L.filter(x => key(x.fac) === key(b)); }
          else list = L.filter(x => key(x.fac) === key(fac) && key(x.mut) === key(b));
          const s = st(list); cs.forEach((c, i) => { if (c >= 0) ov.set(r * 100000 + c, s[i]); });
        }
        if (tcell) ov.set(tcell[0] * 100000 + tcell[1], tcell[2].replace(/\(barchasi\)/i, `(${v})`));
      }
      const M = sheetModel(p.name, {ov}); setHeader(M);
      $('#xlHint').textContent = v ? `${v} — Nomma-nom ro'yxatidan hisoblangan, Excel ranglari bilan` : "Varaqdagi ma'lumotlar Excel'dagidek (ranglari bilan)";
      if (M) drawSheetTable(M);
    };
    $('#ibVil').onchange = draw; draw();
  }
};

/* ---------- umumiy grafiklar ---------- */
function indexStack(id, rws){
  mk(id, {type:'bar', data:{labels:rws.map(r => shortName(r.name)), datasets:[
      {label:'Nufuz', data:rws.map(r=>r.b21), backgroundColor:C.violet, stack:'s'},
      {label:'Bandlik', data:rws.map(r=>r.b22), backgroundColor:C.green, stack:'s'},
      {label:'Muddat', data:rws.map(r=>r.b23), backgroundColor:C.cyan, stack:'s'},
      {label:'Daromad', data:rws.map(r=>r.b24), backgroundColor:C.amber, stack:'s', borderRadius:{topRight:4, bottomRight:4}}]},
    options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'},
      tooltip:{callbacks:{title:it => (rws[it[0].dataIndex].rank ? rws[it[0].dataIndex].rank + '. ' : '') + rws[it[0].dataIndex].name, footer:it => 'Indeks: ' + fD(rws[it[0].dataIndex].idx) + ' / 30'}}},
      scales:{x:{stacked:true, max:30, grid:{color:C.grid}, border:{display:false}}, y:{stacked:true, grid:{display:false}, border:{display:false},
        ticks:{callback(v){ return cut(this.getLabelForValue(v), innerWidth < 640 ? 16 : 40); }}}}}});
}
function stackedStatus(id, rws, label, horizontal){
  mk(id, {type:'bar', data:{labels:rws.map(label), datasets:[
      {label:"Bandligi ta'minlangan", data:rws.map(r=>r.band), backgroundColor:C.green, stack:'s'},
      {label:"O'qishda", data:rws.map(r=>r.oqish), backgroundColor:C.cyan, stack:'s'},
      {label:'Nofaol', data:rws.map(r=>r.nofaol), backgroundColor:C.violet, stack:'s'},
      {label:"O'zini band", data:rws.map(r=>r.ozini), backgroundColor:C.amber, stack:'s'},
      {label:'Ishsiz', data:rws.map(r=>r.ish), backgroundColor:C.red, stack:'s'}]},
    options:{indexAxis: horizontal ? 'y' : 'x', responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}, tooltip:{callbacks:{title:it => rws[it[0].dataIndex].name, footer:it => 'Bandlik: ' + fP(rws[it[0].dataIndex].bandP)}}},
      scales:{x:{stacked:true, grid:{display:!!horizontal, color:C.grid}, border:{display:false}, ticks: horizontal ? {} : {autoSkip:false, maxRotation:50}},
              y:{stacked:true, grid:{display:!horizontal, color:C.grid}, border:{display:false}, ticks: horizontal ? {callback(v){ return cut(this.getLabelForValue(v), innerWidth < 640 ? 18 : 38); }} : {}}}}});
}

loadRemote();
</script>
